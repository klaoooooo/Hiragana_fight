<!DOCTYPE html>
<html>
<head>
    <title>Hiragana Fight</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Press Start 2P', cursive;
            background: #b0b0b0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .title { font-size: 48px; color: #333; text-shadow: 4px 4px 0 #000; margin-bottom: 16px; text-align: center; line-height: 1.4; }
        .welcome { font-size: 12px; color: #444; margin-bottom: 40px; }
        .btn { padding: 16px 48px; font-family: 'Press Start 2P', cursive; font-size: 16px; background: #eee; border: 3px solid #333; border-radius: 12px; cursor: pointer; margin: 8px; display: block; width: 280px; text-align: center; text-decoration: none; color: #333; }
        .btn:hover { background: #ddd; }
        .logout { font-size: 10px; margin-top: 24px; color: #666; }
        .logout a { color: #333; }
    </style>
</head>
<body>
    <div class="title">HiRAGANA<br>FiGHT</div>
    <div class="welcome">WELCOME, {{ request.user.username|upper }}!</div>
    <a class="btn" href="{% url 'level_select' %}">PLAY</a>
    <a class="btn" href="{% url 'leaderboard' %}">LEADERBOARD</a>
    <div class="logout"><a href="{% url 'logout' %}">LOG OUT</a></div>
</body>
</html>
