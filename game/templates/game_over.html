<!DOCTYPE html>
<html>
<head>
    <title>Game Over</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Press Start 2P', cursive; background: #b0b0b0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
        h1 { font-size: 40px; color: #c00; text-shadow: 4px 4px 0 #000; }
        .score { font-size: 16px; color: #333; }
        .btn { padding: 14px 32px; font-family: 'Press Start 2P', cursive; font-size: 14px; background: #eee; border: 3px solid #333; border-radius: 12px; cursor: pointer; text-decoration: none; color: #333; }
        .btn:hover { background: #ddd; }
    </style>
</head>
<body>
    <h1>GAME OVER</h1>
    <div class="score">FINAL SCORE: <span id="final-score">0</span></div>
    <a class="btn" href="{% url 'level_select' %}">PLAY AGAIN</a>
    <a class="btn" href="{% url 'leaderboard' %}">LEADERBOARD</a>
    <a class="btn" href="{% url 'home' %}">HOME</a>
</body>
</html>
